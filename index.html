<script>
const ctx = c.getContext('2d'), T = 32;
const FLEE_CHANCE = 0.25;
const POTION_HEAL = 45;
// coins in a chest: roll in this range, plus more on deeper floors
const CHEST_GOLD = [5, 12], CHEST_GOLD_PER_FLOOR = 1;
const FOE_GEAR_CHANCE = 0.35;
const RAGE_BONUS = 3;
// misses and critical hits (crit multiplies the damage that gets through armor)
const PLAYER_MISS = 0.10, PLAYER_CRIT = 0.10, PLAYER_CRIT_MULT = 2;
const FOE_MISS = 0.10, FOE_CRIT = 0.10, FOE_CRIT_MULT = 1.5;
// one roll decides miss / crit / normal hit
const swingResult = (miss, crit) => {
  const r = Math.random();
  return r < miss ? 'miss' : r < miss + crit ? 'crit' : 'hit';
};
// experience: enemies give XP equal to a fifth of their max HP
const XP_DIVISOR = 5;
const xpToNext = lvl => 25 + 20 * (lvl - 1);
const LEVEL_HEAL = 20; // HP recovered on every level-up

// ---- level-up perks: each level-up deals HAND_SIZE cards, one of them always a basic ----
// Perks can be taken any number of times. The specials grow by less with each repeat.
const HAND_SIZE = 3;
const BASICS = ['attack', 'vitality', 'focus'];
const RARITY_WEIGHT = {common: 10, uncommon: 6, rare: 3}; // how often a perk is dealt
const OWNED_WEIGHT_MULT = 1.5;  // specials you already have turn up a bit more often
const REDRAW_COST = 10;         // coins; each extra redraw in the same level-up costs this much more
const ATTACK_DMG = 2;                                // Attack: +2 damage
const VITALITY_HP = 25, VITALITY_BLOCK_KEEP = 0.85;  // Vitality: +25 max HP, Block lets 15% less through
const FOCUS_CRIT = 0.03, FOCUS_MISS_KEEP = 0.92;     // Focus: +3% crit, miss chance x0.92
const AMBUSH_TOP = 1.0;                              // Pathfinder: first hit on a spotted enemy +50%, 67%, 75%...
const EXEC_THRESHOLD = 0.50, EXEC_TOP = 1.0;         // Executioner: +50%, 67%, 75%... vs enemies under 50% HP
const ANTIDOTE_HEAL_TOP = 20;                        // Antidote: potions heal +10, 13, 15...
const BASH_TOP = 0.30, BASH_DMG_TOP = 12;            // Shield Bash: stun 20%, 25%, 28%...; bash 4, 6, 7...
const PURSE_TOP = 0.60;                              // Tight Purse: gold +30%, 40%, 45%...

// k = how many times the perk is taken; each helper defaults to your current count
const perkN = id => perks[id] || 0;
const curve = (top, c, k) => top * k / (k + c);  // grows by less with every repeat
const pct = x => `${Math.round(x * 100)}%`;
const blockMult = (k = perkN('vitality')) => BLOCK_MULT * VITALITY_BLOCK_KEEP ** k;
const critChance = (k = perkN('focus')) => PLAYER_CRIT + FOCUS_CRIT * k;
const missKeep = (k = perkN('focus')) => FOCUS_MISS_KEEP ** k;
const sight = (k = perkN('pathfinder')) => 1 + k;
const execBonus = (k = perkN('executioner')) => curve(EXEC_TOP, 1, k);
const poisonScale = (k = perkN('antidote')) => 2 / (k + 2);
const poisonDmg = (k = perkN('antidote')) => Math.max(1, Math.round(POISON_DMG * poisonScale(k)));
const poisonTurns = (k = perkN('antidote')) => Math.max(1, Math.round(POISON_TURNS * poisonScale(k)));
const stunChance = (k = perkN('shieldbash')) => STUN_CHANCE + curve(BASH_TOP, 2, k);
const bashDmg = (k = perkN('shieldbash')) => Math.round(curve(BASH_DMG_TOP, 2, k));
const ambushBonus = (k = perkN('pathfinder')) => curve(AMBUSH_TOP, 1, k);
const potionBonus = (k = perkN('antidote')) => Math.round(curve(ANTIDOTE_HEAL_TOP, 1, k));
const potionHeal = () => POTION_HEAL + potionBonus();
const purseBonus = (k = perkN('purse')) => curve(PURSE_TOP, 1, k);

// card = short text on the button, info = the full sentence under the cards (k = count after taking it)
const PERKS = {
  attack: {name: 'Attack', rarity: 'common',
    card: k => `+${ATTACK_DMG} damage`,
    info: k => `+${ATTACK_DMG} damage on every hit (total +${ATTACK_DMG * k}).`},
  vitality: {name: 'Vitality', rarity: 'common',
    card: k => `+${VITALITY_HP} HP, Block ${pct(1 - blockMult(k))}`,
    info: k => `+${VITALITY_HP} max HP and heal ${VITALITY_HP}. Block stops ${pct(1 - blockMult(k))} of damage.`},
  focus: {name: 'Focus', rarity: 'common',
    card: k => `Crit ${pct(critChance(k))}`,
    info: k => `Crit chance ${pct(critChance(k))}, and you miss ${pct(1 - missKeep(k))} less often.`},
  pathfinder: {name: 'Pathfinder', rarity: 'uncommon',
    card: k => `See ${sight(k)}, ambush +${pct(ambushBonus(k))}`,
    info: k => `See ${sight(k)} tiles around you and spot enemies in sight. Your first hit on an enemy you spotted first deals ${pct(ambushBonus(k))} more.`},
  executioner: {name: 'Executioner', rarity: 'uncommon',
    card: k => `+${pct(execBonus(k))} finishers`,
    info: k => `Deal ${pct(execBonus(k))} more damage to enemies under ${pct(EXEC_THRESHOLD)} HP.`},
  antidote: {name: 'Antidote', rarity: 'uncommon',
    card: k => `Potions +${potionBonus(k)}, poison less`,
    info: k => `Potions heal ${potionBonus(k)} more. Poison deals ${poisonDmg(k)} damage for ${poisonTurns(k)} turns (normally ${POISON_DMG} for ${POISON_TURNS}).`},
  shieldbash: {name: 'Shield Bash', rarity: 'uncommon',
    card: k => `Bash ${bashDmg(k)}, stun ${pct(stunChance(k))}`,
    info: k => `When you Block, you bash the front enemy for ${bashDmg(k)}, and each hit on your shield has a ${pct(stunChance(k))} chance to stun.`},
  secondwind: {name: 'Second Wind', rarity: 'rare',
    card: k => '+1 save',
    info: k => 'The next blow that would kill you leaves you at 1 HP instead. Used up when it saves you.'},
  purse: {name: 'Tight Purse', rarity: 'uncommon',
    card: k => `Gold +${pct(purseBonus(k))}`,
    info: k => `Goblins can't steal from you, and you find ${pct(purseBonus(k))} more gold.`}
};

// ---- equipment enchantments: one per item, it stays on the item, the same one stacks across items ----
// Minor fits any gear, Good needs Iron gear or better, Major needs Steel gear
const TIERS = ['Minor', 'Good', 'Major'];
const TIER_NEED = ['any gear', 'Iron gear or better', 'Steel gear'];
const TIER_FLOOR = [1, 2, 4];            // first floor where drops and scrolls can carry this tier
const TIER_PRICE = [15, 30, 50];         // Enchanter prices (floor 3)
const ENCHANT_DROP_CHANCE = 0.20;        // gear from fights and chests comes enchanted
const SCROLL_CHANCE = 0.25;              // a chest holds a scroll instead of coins, a potion or gear
const BAG_SLOTS = 2, SATCHEL_PRICE = 25; // scroll bag; the Scroll Satchel adds one slot
const BURN_TURNS = 3, GIANT_HP = 100;
const PURITY_DRAIN = [0.25, 0.50, 0.75]; // share of Wraith drain each Purity item blocks
// vals = strength at Minor / Good / Major
const ENCHANTS = {
  flaming:     {name: 'Flaming', slot: 'weapon', vals: [2, 3, 4], desc: 'sets enemies on fire',
                text: v => `hits burn for ${v} a turn for ${BURN_TURNS} turns, and burning Trolls can't regenerate`},
  vampiric:    {name: 'Vampiric', slot: 'weapon', vals: [0.05, 0.08, 0.12], desc: 'heals you as you hit',
                text: v => `heal ${pct(v)} of the damage you deal`},
  balanced:    {name: 'Balanced', slot: 'weapon', vals: [0.15, 0.25, 0.35], desc: 'Heavy misses less',
                text: v => `Heavy misses ${pct(v)} less often`},
  giantslayer: {name: 'Giantslayer', slot: 'weapon', vals: [0.10, 0.20, 0.30], desc: 'hurts big enemies more',
                text: v => `+${pct(v)} damage to enemies with ${GIANT_HP}+ HP`},
  swift:       {name: 'Swift', slot: 'weapon', vals: [0.08, 0.12, 0.16], desc: 'may strike twice',
                text: v => `${pct(v)} chance to strike a second time`},
  thorns:      {name: 'Thorns', slot: 'armor', vals: [2, 3, 5], desc: 'hurts enemies that hit you',
                text: v => `enemies that hit you take ${v} damage`},
  mending:     {name: 'Mending', slot: 'armor', vals: [3, 5, 8], desc: 'heals you after fights',
                text: v => `heal ${v} HP after every fight you win`},
  fortitude:   {name: 'Fortitude', slot: 'armor', vals: [10, 20, 30], desc: 'more max HP',
                text: v => `+${v} max HP`},
  purity:      {name: 'Purity', slot: 'armor', vals: [1, 2, 3], desc: 'resists poison and drain',
                text: v => `poison lasts ${v} fewer turns and Wraith drain is cut ${pct(PURITY_DRAIN[v - 1])}`},
  fleetfoot:   {name: 'Fleetfoot', slot: 'armor', vals: [0.10, 0.15, 0.20], desc: 'easier to flee',
                text: v => `+${pct(v)} chance to flee`},
  fortune:     {name: 'Fortune', slot: 'armor', vals: [0.10, 0.20, 0.30], desc: 'more gold',
                text: v => `+${pct(v)} gold from kills and chests`}
};
const enchSlots = id => ENCHANTS[id].slot === 'weapon' ? ['weapon'] : armor;
const enchLabel = e => `${ENCHANTS[e.id].name} (${TIERS[e.t]})`;
const enchText = e => ENCHANTS[e.id].text(ENCHANTS[e.id].vals[e.t]);
const itemName = it => it.ench ? `${it.name} of ${ENCHANTS[it.ench.id].name} (${TIERS[it.ench.t]})` : it.name;
// total strength of an enchantment across everything you wear
const enchSum = id => Object.values(worn).reduce((s, it) =>
  s + (it && it.ench && it.ench.id === id ? ENCHANTS[id].vals[it.ench.t] : 0), 0);
const purityKeep = () => Object.values(worn).reduce((m, it) =>
  m * (it && it.ench && it.ench.id === 'purity' ? 1 - PURITY_DRAIN[it.ench.t] : 1), 1);
// highest tier drops and scrolls can have on this floor
const floorTier = () => TIER_FLOOR.filter(f => floor + 1 >= f).length - 1;
const randomEnchant = slotKey => {
  const ids = Object.keys(ENCHANTS).filter(id => !slotKey || enchSlots(id).includes(slotKey));
  return ids[roll(0, ids.length - 1)];
};
// S = where you arrive, D = stairs down, E = dungeon exit (last floor only)
const W = 9, H = 11, FLOORS = 5;
const FLOOR_SHOPS = [null, 'M', 'X', 'N', null]; // M/N = merchants, X = the Enchanter
const CHESTS_PER_FLOOR = 3;
const ENEMIES_PER_FLOOR = [8, 8, 9, 9, 9]; // plus the stairs guard / boss
// [near zone, far zone] per floor - zone 0: Bat/Slime, 1: Goblin/Skeleton,
// 2: Orc/Troll, 3: Dark Knight/Wraith, 4: Minotaur/Wyvern
const FLOOR_ZONES = [[0, 1], [1, 1], [2, 3], [3, 4], [4, 4]];
let floor = 0, map = [];
const colors = {'#': '#555', '.': '#222', 'S': '#222', 'E': '#fc3', 'D': '#3cf',
                'M': '#a6f', 'N': '#a6f', 'X': '#2cb', 'C': '#c80'};
const FOG = '#000';
const roll = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
const shuffle = a => {
  for (let i = a.length - 1; i > 0; i--) {
    const j = roll(0, i);
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
};
const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
const openNbrs = (g, x, y) => DIRS.map(([dx, dy]) => [x + dx, y + dy]).filter(([a, b]) => g[b][a] !== '#');

// carve a random maze over the odd-numbered tiles, then knock out a few walls for loops
function carve() {
  const g = Array.from({length: H}, () => Array(W).fill('#'));
  const start = [2 * roll(0, (W - 3) / 2) + 1, 2 * roll(0, (H - 3) / 2) + 1];
  g[start[1]][start[0]] = '.';
  const stack = [start];
  while (stack.length) {
    const [x, y] = stack[stack.length - 1];
    const next = shuffle(DIRS.map(([dx, dy]) => [x + 2 * dx, y + 2 * dy, x + dx, y + dy]))
      .find(([nx, ny]) => nx > 0 && ny > 0 && nx < W - 1 && ny < H - 1 && g[ny][nx] === '#');
    if (!next) { stack.pop(); continue; }
    const [nx, ny, wx, wy] = next;
    g[wy][wx] = g[ny][nx] = '.';
    stack.push([nx, ny]);
  }
  for (let n = 0; n < 5; n++) {
    const x = roll(1, W - 2), y = roll(1, H - 2);
    if ((x + y) % 2 === 1) g[y][x] = '.';
  }
  return g;
}

function distances(g, sx, sy) {
  const dist = new Map([[`${sx},${sy}`, 0]]), q = [[sx, sy]];
  while (q.length) {
    const [x, y] = q.shift();
    for (const [nx, ny] of openNbrs(g, x, y)) {
      const k = `${nx},${ny}`;
      if (!dist.has(k)) { dist.set(k, dist.get(`${x},${y}`) + 1); q.push([nx, ny]); }
    }
  }
  return dist;
}

// stairs/exit go on the dead end farthest from the start, guarded on its only way in
// enemies: [x, y, hard] - hard spots (far from the start) roll from the next zone up
function makeFloor(i) {
  for (;;) {
    const g = carve();
    const open = [];
    g.forEach((r, y) => r.forEach((c, x) => { if (c !== '#') open.push([x, y]); }));
    const [sx, sy] = open[roll(0, open.length - 1)];
    const dist = distances(g, sx, sy);
    const d = ([x, y]) => dist.get(`${x},${y}`);
    const ends = open.filter(([x, y]) => openNbrs(g, x, y).length === 1 && d([x, y]) >= 6);
    if (!ends.length) continue;
    const goal = ends.reduce((a, b) => d(b) > d(a) ? b : a);
    const [guard] = openNbrs(g, goal[0], goal[1]);
    const far = d(goal);
    g[sy][sx] = 'S';
    g[goal[1]][goal[0]] = i === FLOORS - 1 ? 'E' : 'D';
    const free = shuffle(open.filter(t =>
      g[t[1]][t[0]] === '.' && d(t) >= 2 && !(t[0] === guard[0] && t[1] === guard[1])));
    for (let n = 0; n < CHESTS_PER_FLOOR; n++) {
      const [x, y] = free.pop();
      g[y][x] = 'C';
    }
    if (FLOOR_SHOPS[i]) {
      const [x, y] = free.pop();
      g[y][x] = FLOOR_SHOPS[i];
    }
    const enemies = free.slice(0, ENEMIES_PER_FLOOR[i]).map(t => [t[0], t[1], d(t) > far / 2 ? 1 : 0]);
    if (i < FLOORS - 1) enemies.push([guard[0], guard[1], 1]);
    return {map: g.map(r => r.join('')), enemies, guard};
  }
}

const slots = {
  weapon:  {label: 'Weapon',  items: [['Rusty Sword', 2], ['Iron Sword', 4], ['Steel Sword', 6]]},
  helmet:  {label: 'Helmet',  items: [['Leather Cap', 1], ['Iron Helm', 2], ['Steel Helm', 3]]},

};

const power = k => worn[k] ? worn[k].power : 0;

let hand = [], redraws = 0, secondWinds = 0;

const shops = {
  M: {title: 'Iron Merchant', tier: 1},
  N: {title: 'Steel Merchant', tier: 2},
  X: {title: 'Enchanter', enchanter: true}
};
// potion carry upgrades: each one needs the one before it (from = the limit it upgrades)
const BAGS = [
  {type: 'bag', name: 'Potion Belt',      from: 5, to: 7,  price: 40, tier: 1},

];
let shopStock = [], shopTitle = '';

// gearTier = highest item tier the enemy can carry (leave it out for no gear)
// armorMax = most armor pieces it can wear (defaults to 1)
const types = [
  {name: 'Bat',      zone: 0, hp: 16,  dmg: [3, 7],   gold: [2, 4],   color: '#98a', evasion: 0.30},
  {name: 'Slime',    zone: 0, hp: 28,  dmg: [2, 6],   gold: [2, 5],   color: '#6c6', split: true},
  {name: 'Goblin',   zone: 1, hp: 45,  dmg: [5, 9],   gold: [4, 7],   color: '#ee4', gearTier: 0, thief: true},
  {name: 'Skeleton', zone: 1, hp: 50,  dmg: [6, 10],  gold: [4, 8],   color: '#ddd', gearTier: 1, reassemble: true, minFloor: 2},
  {name: 'Orc',      zone: 2, hp: 70,  dmg: [8, 13],  gold: [5, 8],  color: '#c33', gearTier: 1, armorMax: 2, bloodlust: 4},
  {name: 'Troll',    zone: 2, hp: 100, dmg: [10, 16], gold: [6, 9],  color: '#a52', regen: 6},
  {name: 'Dark Knight', zone: 3, hp: 85, dmg: [11, 16], gold: [6, 10], color: '#668', gearTier: 2, armorMax: 3, riposte: true},
  {name: 'Wraith',   zone: 3, hp: 75,  dmg: [12, 18], gold: [6, 9],  color: '#bbf', drain: 0.25},
  {name: 'Minotaur', zone: 4, hp: 130, dmg: [15, 22], gold: [7, 11], color: '#35b', charge: true},
  {name: 'Wyvern',   zone: 4, hp: 110, dmg: [14, 21], gold: [7, 10], color: '#d4a', poison: true}
];
// special abilities (set on each enemy type above):
//   evasion    - your chance to miss it (instead of PLAYER_MISS)
//   split      - turns into two Little Slimes when killed
//   thief      - may steal coins once, fights THIEF_TURNS more turns, then runs off with them

//   drain      - heals itself for this share of the damage it deals
//   charge     - its first attack of each fight deals double damage
//   poison     - hits may poison you (POISON_DMG per turn or step, cured by a potion)
const LITTLE_SLIME = {name: 'Little Slime', hp: 14, dmg: [1, 4], gold: [1, 2], color: '#9e9'};
const THIEF_CHANCE = 0.33, THIEF_STEAL = [3, 6], THIEF_TURNS = 3;
const REASSEMBLE_CHANCE = 0.33, REASSEMBLE_HP = 0.25;
const POISON_CHANCE = 0.35, POISON_DMG = 3, POISON_TURNS = 4;
// your combat moves: Heavy hits harder but misses more often and leaves you open
// (enemies hit 20% harder in their next attacks); Block cuts incoming damage by 75%
const HEAVY_MULT = 1.75, HEAVY_MISS = 0.35, HEAVY_EXPOSED = 1.20, BLOCK_MULT = 0.25;
const STUN_CHANCE = 0.10; // chance a blocked hit stuns that enemy for its next turn
// every crushEvery-th Ogre King attack ignores your defense (he warns you the turn before)
const BOSS = {name: 'Ogre King', hp: 260, dmg: [18, 24], gold: [40, 60], color: '#900', def: 4, crushEvery: 3, boss: true};
// minFloor keeps an enemy off the floors above it (floor numbers start at 1)
const pick = z => {
  const pool = types.filter(t => t.zone === z && floor + 1 >= (t.minFloor || 1));
  return pool[roll(0, pool.length - 1)];
};

function groupSize(zone) {
  const r = Math.random();
  if (zone === 0) return 1;
  if (zone === 1) return r < 0.3 ? 2 : 1;
  if (zone === 2) return r < 0.15 ? 3 : r < 0.55 ? 2 : 1;
  return r < 0.25 ? 3 : r < 0.65 ? 2 : 1;
}

function equipFoe(f, t) {
  if (Math.random() < FOE_GEAR_CHANCE) {
    const [name, pow] = slots.weapon.items[roll(0, t.gearTier)];
    f.items.push(name);
    f.bonus = Math.ceil(pow / 2);
  }
  const free = [...armor];
  for (let n = 0; n < (t.armorMax || 1); n++) {
    if (Math.random() >= FOE_GEAR_CHANCE) continue;
    const k = free.splice(roll(0, free.length - 1), 1)[0];
    const [name, pow] = slots[k].items[roll(0, t.gearTier)];
    f.items.push(name);
    f.def += pow;
  }
}

function makeGroup(zone) {
  return Array.from({length: groupSize(zone)}, (_, i) => {
    const t = pick(i === 0 ? zone : roll(Math.max(0, zone - 1), zone));
    const f = {...t, max: t.hp, bonus: 0, def: 0, items: []};
    if (t.gearTier !== undefined) equipFoe(f, t);
    return f;
  });
}

const describe = f => f.items.length ? `${f.name} (${f.items.join(', ')})` : f.name;

let p = {x: 4, y: 9, hp: 100, max: 100, base: 100}; // base = max HP before Fortitude gear
let prev = {x: 4, y: 9};
let enemies = [];
let foes = [], current = null, pending = null;
let phase = 'explore', over = false;
let coins = 0, potions = 0;
let maxPotions = 5;        // most potions you can carry (merchants sell upgrades)
const SHOP_POTIONS = 5;   // potions each merchant has in stock
let shopPotionsLeft = SHOP_POTIONS;
let poison = 0; // turns of poison left
let scrolls = [], bagSlots = BAG_SLOTS; // scrolls kept in your bag: {id, t}
let scrollNow = null;                   // the scroll being placed: {id, t, fromBag: index or null}
let ench = {};                          // Enchanter menu state: {slot, id}

// numbers for the end-of-run summary
const run = {start: Date.now(), kills: {}, gold: 0, dealt: 0, taken: 0, crits: 0,
             misses: 0, biggest: 0, potions: 0, chests: 0, steps: 0};
// adds Tight Purse's bonus; returns the coins you actually got
function earn(gold) {
  const got = gold + Math.round(gold * (purseBonus() + enchSum('fortune')));
  coins += got;
  run.gold += got;
  return got;
}
const enchantedList = () => Object.values(worn).filter(it => it && it.ench).map(itemName).join(', ');
const perkList = () => Object.keys(PERKS).filter(perkN)
  .map(id => `${PERKS[id].name} &times;${perkN(id)}`).join(', ');

function endRun(won, killer) {
  over = true;
  ['choice', 'fightBox', 'lootBox', 'levelBox', 'shop', 'scrollBox'].forEach(id => document.getElementById(id).hidden = true);
  potionBtn.hidden = true;
  bagBtn.hidden = true;
  showGear();
  const secs = Math.round((Date.now() - run.start) / 1000);
  const time = `${Math.floor(secs / 60)}:${String(secs % 60).padStart(2, '0')}`;
  const total = Object.values(run.kills).reduce((a, b) => a + b, 0);
  const killList = Object.entries(run.kills).sort((a, b) => b[1] - a[1])
    .map(([name, n]) => `${name} &times;${n}`).join(', ');
  const rows = [
    ['Floor reached', `${floor + 1} / ${FLOORS}`],
    ['Level', level],
    ['Enemies defeated', total],
    ['Gold earned', run.gold],
    ['Damage dealt', run.dealt],
    ['Damage taken', run.taken],
    ['Critical hits', run.crits],
    ['Misses', run.misses],
    ['Biggest hit', run.biggest],
    ['Potions drunk', run.potions],
    ['Chests opened', run.chests],
    ['Steps taken', run.steps],
    ['Time', time]
  ];
  summary.className = won ? 'won' : '';
  summary.innerHTML =
    `<h2>${won ? 'You escaped the dungeon!' : `Slain on floor ${floor + 1}`}</h2>` +
    `<p class="cause">${won ? `The ${BOSS.name} has fallen.`
      : `Killed by ${killer === BOSS.name ? 'the' : /^[AEIOU]/.test(killer) ? 'an' : 'a'} ${killer}.`}</p>` +
    `<dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>` +
    (killList ? `<p class="kills">Defeated: ${killList}</p>` : '') +
    (perkList() ? `<p class="kills">Perks: ${perkList()}</p>` : '') +
    (enchantedList() ? `<p class="kills">Enchanted gear: ${enchantedList()}</p>` : '') +
    `<button id="againBtn">Play again</button>`;
  summary.hidden = false;
  summary.querySelector('#againBtn').onclick = () => location.reload();
}
const opened = new Set();
const visited = new Set();
const lastFloor = () => floor === FLOORS - 1;
// you see tiles you've walked on plus the tiles around you (1 away, more with Pathfinder)
const inSight = (x, y) => Math.abs(x - p.x) <= sight() && Math.abs(y - p.y) <= sight();
const visible = (x, y) => visited.has(`${x},${y}`) || inSight(x, y);

function loadFloor(i) {
  floor = i;
  const lvl = makeFloor(i);
  map = lvl.map;
  opened.clear();
  shopPotionsLeft = SHOP_POTIONS; // one merchant per floor at most
  visited.clear();
  enemies = lvl.enemies.map(([x, y, hard]) => ({x, y, zone: FLOOR_ZONES[i][hard], group: null}));
  // the exit is a dead end, so the boss on its only way in can't be skipped
  if (lastFloor()) enemies.push({
    x: lvl.guard[0], y: lvl.guard[1], zone: 4, boss: true,
    group: [{...BOSS, max: BOSS.hp, bonus: 0, items: []}]
  });
  const sy = map.findIndex(r => r.includes('S'));
  p.x = map[sy].indexOf('S');
  p.y = sy;
  prev = {x: p.x, y: p.y};
  visited.add(`${p.x},${p.y}`);
}
loadFloor(0);

// max HP = your base (start + Vitality) plus Fortitude gear; new max HP comes already filled
function refreshMax() {
  const old = p.max;
  p.max = p.base + enchSum('fortitude');
  if (p.max > old) p.hp += p.max - old;
  p.hp = Math.min(p.hp, p.max);
}

function showGear() {
  panel.innerHTML = Object.keys(slots).map(k =>
    `${slots[k].label}: ${worn[k] ? `${itemName(worn[k])} (+${worn[k].power})` : 'empty'}`
  ).join('<br>') + `<br><b>Defense: ${defense()}</b>` +
    `<br>Scrolls: ${scrolls.map(enchLabel).join(', ') || 'none'} (${scrolls.length}/${bagSlots})` +
    `<br>Level ${level} (XP ${xp}/${xpToNext(level)}) - Damage +${bonusDmg}, HP ${p.hp}/${p.max}` +
    `<br>Coins: ${coins}<br>Potions: ${potions}/${maxPotions}` +
    `<br>Perks: ${perkList() || 'none'}` + (secondWinds ? ` (Second Wind saves left: ${secondWinds})` : '') +
    (poison ? `<br><b>Poisoned</b> (${poison} turns, a potion cures it)` : '');
  potionBtn.textContent = `Potion (${potions}/${maxPotions})`;
  bagBtn.textContent = `Scrolls (${scrolls.length}/${bagSlots})`;
}

function renderShop() {
  shop.innerHTML = `<b>${shopTitle}</b> (Coins: ${coins})<br>` + shopStock.map((it, i) => {
    const cur = it.type === 'gear' ? worn[it.slot] : null;
    const note = it.type === 'gear'
      ? ` (+${it.power}, now: ${cur ? `${itemName(cur)} +${cur.power}` : 'empty'}` +
        (cur && cur.ench ? `, loses ${enchLabel(cur.ench)})` : ')')
      : it.type === 'bag'
        ? ` (carry ${it.to} potions` + (maxPotions >= it.to ? ', owned)'
          : maxPotions < it.from ? `, needs ${BAGS.find(b => b.to === it.from).name} first)` : ')')
        : it.type === 'satchel'
          ? ` (carry ${BAG_SLOTS + 1} scrolls` + (bagSlots > BAG_SLOTS ? ', owned)' : ')')
          : ` (+${potionHeal()} HP, ${shopPotionsLeft} left` +
            (potions >= maxPotions ? ', your bag is full)' : ')');
    const off = !canBuy(it) ? 'disabled' : '';
    return `<button data-i="${i}" ${off}>${it.name}${note} - ${it.price}c</button>`;
  }).join('<br>') + '<br><button id="shopLeave">Leave shop</button>';
}

function canBuy(it) {
  if (coins < it.price) return false;
  if (it.type === 'potion') return shopPotionsLeft > 0 && potions < maxPotions;
  if (it.type === 'bag') return maxPotions === it.from;
  if (it.type === 'satchel') return bagSlots === BAG_SLOTS;
  return !(worn[it.slot] && worn[it.slot].power >= it.power);
}

// gear found in fights and chests; tier = 0 Rusty/Leather, 1 Iron, 2 Steel
function loot(maxTier = 2, minTier = 0) {
  const k = Object.keys(slots)[roll(0, 4)];
  const tier = roll(minTier, maxTier);
  const [name, pow] = slots[k].items[tier];
  pending = {slot: k, name, power: pow, tier};
  if (Math.random() < ENCHANT_DROP_CHANCE)
    pending.ench = {id: randomEnchant(k), t: Math.min(tier, floorTier())};
  phase = 'loot';
  lootBox.hidden = false;
  const cur = worn[k];
  return `Found ${itemName(pending)} (+${pow})` + (pending.ench ? `: ${enchText(pending.ench)}. ` : '. ') + (cur
    ? `You wear ${itemName(cur)} (+${cur.power}).`
    : `Your ${slots[k].label} slot is empty.`);
}

// ---- scrolls: put one on a worn item now, keep it in your bag, or throw it away ----
function openScroll(s, fromBag) {
  scrollNow = {id: s.id, t: s.t, fromBag};
  phase = 'scroll';
  renderScrollBox();
  scrollBox.hidden = false;
}

function renderScrollBox() {
  const s = scrollNow;
  scrollBox.innerHTML = `<b>Scroll of ${enchLabel(s)}</b>: ${enchText(s)} (${TIER_NEED[s.t]}). Put it on:<br>` +
    enchSlots(s.id).map(k => {
      const it = worn[k], ok = it && it.tier >= s.t;
      const why = !it ? '' : !ok ? ` (needs ${TIER_NEED[s.t]})` : it.ench ? ` (replaces ${enchLabel(it.ench)})` : '';
      return `<button data-scroll="${k}"${ok ? '' : ' disabled'}>${slots[k].label}: ${it ? itemName(it) : 'empty'}${why}</button>`;
    }).join('<br>') + '<br>' +
    (s.fromBag === null
      ? `<button data-scroll="keep"${scrolls.length >= bagSlots ? ' disabled' : ''}>Keep in bag (${scrolls.length}/${bagSlots})</button> ` +
        '<button data-scroll="discard">Throw away</button>'
      : '<button data-scroll="back">Back</button>');
}

function closeScroll(text) {
  scrollNow = null;
  scrollBox.hidden = true;
  phase = 'explore';
  msg.textContent = text;
  showGear();
  draw();
}

function showBag() {
  phase = 'bag';
  scrollBox.innerHTML = 'Your scrolls:<br>' +
    scrolls.map((s, i) => `<button data-bag="${i}">${enchLabel(s)}: ${enchText(s)}</button>`).join('<br>') +
    '<br><button data-bag="close">Close</button>';
  scrollBox.hidden = false;
}

bagBtn.onclick = () => {
  if (over || phase !== 'explore') return;
  if (!scrolls.length) { msg.textContent = 'Your bag has no scrolls.'; return; }
  showBag();
};

scrollBox.onclick = e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (b.dataset.bag !== undefined) {
    if (b.dataset.bag === 'close') return closeScroll('');
    const i = +b.dataset.bag;
    return openScroll(scrolls[i], i);
  }
  const s = scrollNow, k = b.dataset.scroll;
  if (k === 'keep') { scrolls.push({id: s.id, t: s.t}); return closeScroll(`You put the Scroll of ${enchLabel(s)} in your bag.`); }
  if (k === 'discard') return closeScroll(`You throw away the Scroll of ${enchLabel(s)}.`);
  if (k === 'back') return showBag();
  const it = worn[k];
  if (!it || it.tier < s.t) return;
  if (s.fromBag !== null) scrolls.splice(s.fromBag, 1);
  it.ench = {id: s.id, t: s.t};
  refreshMax();
  closeScroll(`You read the scroll. Your ${itemName(it)} glows: ${enchText(it.ench)}.`);
};

// ---- the Enchanter (floor 3): pick a worn item, then an enchantment, then a tier ----
function renderEnchanter() {
  let html = `<b>Enchanter</b> (Coins: ${coins})<br>`;
  const it = ench.slot && worn[ench.slot];
  if (!it) {
    html += 'Which piece of gear?<br>' + Object.keys(slots).map(k =>
      `<button data-e="slot:${k}"${worn[k] ? '' : ' disabled'}>${slots[k].label}: ${worn[k] ? itemName(worn[k]) : 'empty'}</button>`
    ).join('<br>');
  } else if (!ench.id) {
    html += `${itemName(it)}: which enchantment?<br>` + Object.keys(ENCHANTS)
      .filter(id => enchSlots(id).includes(ench.slot))
      .map(id => `<button data-e="id:${id}">${ENCHANTS[id].name} (${ENCHANTS[id].desc})</button>`).join('<br>') +
      '<br><button data-e="back">Back</button>';
  } else {
    const E = ENCHANTS[ench.id];
    html += `${E.name} on your ${itemName(it)}` + (it.ench ? ` (replaces ${enchLabel(it.ench)})` : '') + ':<br>' +
      TIERS.map((name, t) => {
        const ok = it.tier >= t && coins >= TIER_PRICE[t];
        const why = it.tier < t ? ` (needs ${TIER_NEED[t]})` : '';
        return `<button data-e="tier:${t}"${ok ? '' : ' disabled'}>${name}: ${E.text(E.vals[t])} - ${TIER_PRICE[t]}c${why}</button>`;
      }).join('<br>') + '<br><button data-e="back">Back</button>';
  }
  shop.innerHTML = html + '<br><button data-e="leave">Leave</button>';
}

function enchanterClick(b) {
  const [cmd, arg] = b.dataset.e.split(':');
  if (cmd === 'leave') {
    shop.hidden = true;
    phase = 'explore';
    msg.textContent = '';
    return;
  }
  if (cmd === 'slot') ench = {slot: arg};
  if (cmd === 'id') ench.id = arg;
  if (cmd === 'back') { if (ench.id) delete ench.id; else ench = {}; }
  if (cmd === 'tier') {
    const t = +arg, it = worn[ench.slot];
    if (it.tier < t || coins < TIER_PRICE[t]) return;
    coins -= TIER_PRICE[t];
    it.ench = {id: ench.id, t};
    refreshMax();
    msg.textContent = `Runes flare across your gear. Your ${itemName(it)}: ${enchText(it.ench)}.`;
    ench = {};
  }
  showGear();
  renderEnchanter();
}

function openChest(key) {
  opened.add(key);
  run.chests++;
  if (Math.random() < SCROLL_CHANCE) {
    const s = {id: randomEnchant(), t: roll(0, floorTier())};
    openScroll(s, null);
    return `It holds a Scroll of ${enchLabel(s)}!`;
  }
  const r = roll(1, 3);
  if (r === 1) {
    const got = earn(roll(CHEST_GOLD[0], CHEST_GOLD[1]) + floor * CHEST_GOLD_PER_FLOOR);
    showGear();
    return `It holds ${got} coins!`;
  }
  if (r === 2 && potions < maxPotions) {
    potions++;
    showGear();
    return 'It holds a health potion!';
  }
  if (r === 2) {
    const got = earn(roll(CHEST_GOLD[0], CHEST_GOLD[1]) + floor * CHEST_GOLD_PER_FLOOR);
    showGear();
    return `It holds a health potion, but your bag is full. You take ${got} coins instead.`;
  }
  return 'It holds equipment. ' + loot();
}

function closeLoot() {
  pending = null;
  lootBox.hidden = true;
  phase = 'explore';
  showLevelUp();
  showGear();
}

function gainXp(amount) {
  xp += amount;
  while (xp >= xpToNext(level + levelUps)) {
    xp -= xpToNext(level + levelUps);
    levelUps++;
  }
}

// deal a hand: one random basic, then cards drawn by rarity (no duplicates in a hand)
function dealHand() {
  const basic = BASICS[roll(0, BASICS.length - 1)];
  const pool = Object.keys(PERKS).filter(id => id !== basic);
  hand = [basic];
  while (hand.length < HAND_SIZE && pool.length) {
    const weights = pool.map(id => RARITY_WEIGHT[PERKS[id].rarity] *
      (perkN(id) && !BASICS.includes(id) ? OWNED_WEIGHT_MULT : 1));
    let r = Math.random() * weights.reduce((a, b) => a + b, 0), i = 0;
    while (i < pool.length - 1 && r >= weights[i]) r -= weights[i++];
    hand.push(pool.splice(i, 1)[0]);
  }
}

const redrawCost = () => REDRAW_COST * (redraws + 1);

function renderLevelBox() {
  levelBox.innerHTML = hand.map(id => {
    const P = PERKS[id];
    return `<button data-up="${id}" class="${P.rarity}">${P.name}<small>${P.card(perkN(id) + 1)}</small></button>`;
  }).join('') +
    `<button data-up="redraw"${coins < redrawCost() ? ' disabled' : ''}>Redraw<small>${redrawCost()} coins</small></button>` +
    `<p>${hand.map(id => `<b>${PERKS[id].name}:</b> ${PERKS[id].info(perkN(id) + 1)}`).join('<br>')}</p>`;
}

function showLevelUp() {
  if (!levelUps) return;
  phase = 'level';
  redraws = 0;
  dealHand();
  renderLevelBox();
  levelBox.hidden = false;
  msg.textContent += ` Level up! You reached level ${level + 1}. Pick a perk:`;
}

function redraw() {
  const cost = redrawCost();
  if (phase !== 'level' || coins < cost) return;
  coins -= cost;
  redraws++;
  dealHand();
  renderLevelBox();
  msg.textContent = `You pay ${cost} coins and redraw the cards. Pick a perk:`;
  showGear();
}

function takePerk(id) {
  if (phase !== 'level' || !hand.includes(id)) return;
  perks[id] = perkN(id) + 1;
  if (id === 'attack') bonusDmg += ATTACK_DMG;
  if (id === 'vitality') { p.base += VITALITY_HP; refreshMax(); }
  if (id === 'secondwind') secondWinds++;
  level++;
  levelUps--;
  const healed = Math.min(LEVEL_HEAL, p.max - p.hp);
  p.hp += healed;
  msg.textContent = `You take ${PERKS[id].name} (${PERKS[id].card(perks[id])}). You are now level ${level}.` +
    (healed ? ` You recover ${healed} HP.` : '');
  levelBox.hidden = true;
  phase = 'explore';
  showLevelUp();
  showGear();
  draw();
}

levelBox.onclick = e => {
  const b = e.target.closest('button[data-up]');
  if (!b || b.disabled) return;
  if (b.dataset.up === 'redraw') redraw();
  else takePerk(b.dataset.up);
};

function bar(x, y, w, h, hp, max, color) {
  ctx.fillStyle = '#400';
  ctx.fillRect(x, y, w, h);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * hp / max, h);
}

function draw() {
  map.forEach((row, y) => [...row].forEach((ch, x) => {
    ctx.fillStyle = !visible(x, y) ? FOG
      : ch === 'C' && opened.has(`${x},${y}`) ? '#432' : colors[ch];
    ctx.fillRect(x * T, y * T, T, T);
  }));
  // Pathfinder spots enemies in sight before you bump into them
  const spotted = e => perkN('pathfinder') && inSight(e.x, e.y);
  enemies.forEach(e => { if (spotted(e) && e !== current) e.spottedEarly = true; }); // you can ambush it
  enemies.filter(e => (e.seen || e.boss || spotted(e)) && !e.dead && visible(e.x, e.y)).forEach(e => {
    if (!e.group) e.group = makeGroup(e.zone);
    ctx.fillStyle = e.group.find(f => f.hp > 0)?.color || e.group[0].color;
    ctx.fillRect(e.x * T, e.y * T, T, T);
    if (e.boss) {
      ctx.strokeStyle = '#fff';
      ctx.strokeRect(e.x * T + 1, e.y * T + 1, T - 2, T - 2);
    }
  });
  ctx.fillStyle = '#4af';
  ctx.fillRect(p.x * T + 8, p.y * T + 8, T - 16, T - 16);

  ctx.fillStyle = '#111';
  ctx.fillRect(0, 352, 288, 48);
  ctx.fillStyle = '#fff';
  ctx.font = '12px sans-serif';
  ctx.fillText(`Lv ${level} - Floor ${floor + 1}/${FLOORS}`, 8, 368);
  bar(8, 374, 120, 12, p.hp, p.max, poison ? '#a5d' : '#4c4'); // purple while poisoned
  bar(8, 390, 120, 4, xp, xpToNext(level + levelUps), '#fc3');
  const live = foes.filter(f => f.hp > 0);
  const gap = live.length > 3 ? 10 : 14;
  live.forEach((f, i) => {
    ctx.fillStyle = '#fff';
    ctx.font = '10px sans-serif';
    ctx.fillText(f.name + (f.items.length ? '*' : ''), 140, 364 + i * gap);
    bar(204, 356 + i * gap, 76, 8, f.hp, f.max, f.color);
  });
  fightBox.hidden = over || phase !== 'fight';
}

// ends the run if you're dead; returns true while you're still alive
function checkDeath(killer, text) {
  if (p.hp > 0) return true;
  if (secondWinds > 0) {
    secondWinds--;
    p.hp = 1;
    msg.textContent += ' SECOND WIND! You refuse to fall and stand back up with 1 HP.';
    showGear();
    return true;
  }
  msg.textContent = text;
  endRun(false, killer);
  draw();
  return false;
}

// poison ticks once per combat turn and once per step
function tickPoison() {
  if (!poison) return true;
  poison--;
  const hurt = Math.min(poisonDmg(), p.hp);
  p.hp -= hurt;
  run.taken += hurt;
  msg.textContent += ` Poison burns you for ${hurt}` + (poison ? ` (${poison} more).` : '. The poison wears off.');
  showGear();
  return checkDeath("Wyvern's poison", 'The poison was too much. You collapse.');
}

// one enemy swing; mult comes from your stance (Block lowers it, Heavy raises it)
function foeStrike(f, mult) {
  const rage = f.raged ? RAGE_BONUS : 0;
  f.swings = (f.swings || 0) + 1;
  const crush = f.crushEvery && f.swings % f.crushEvery === 0;
  const charge = f.charge && f.fresh;
  f.fresh = false;
  // the Crushing Blow and the Charge always land, and never crit
  const result = crush || charge ? 'hit' : swingResult(FOE_MISS, FOE_CRIT);
  f.landed = result !== 'miss';
  if (result === 'miss') {
    msg.textContent += ` ${f.name} misses you.`;
  } else {
    const lust = f.bloodlust && p.hp < p.max / 2 ? f.bloodlust : 0;
    let hurt = Math.max(1, roll(f.dmg[0], f.dmg[1]) + f.bonus + rage + lust - (crush ? 0 : defense()));
    if (result === 'crit') hurt = Math.round(hurt * FOE_CRIT_MULT);
    if (charge) hurt *= 2;
    hurt = Math.max(1, Math.round(hurt * mult));
    run.taken += Math.min(hurt, p.hp);
    p.hp = Math.max(0, p.hp - hurt);
    msg.textContent += crush
      ? ` ${f.name} lands a CRUSHING BLOW through your armor for ${hurt}!`
      : charge
        ? ` The ${f.name} CHARGES into you for ${hurt}!`
        : result === 'crit'
          ? ` ${f.name} lands a CRITICAL HIT for ${hurt}!`
          : ` ${f.name} ${lust ? 'hits you in a bloodlust' : 'hits you'} for ${hurt}.`;
    if (f.drain && p.hp > 0) {
      const heal = Math.min(Math.round(hurt * f.drain * purityKeep()), f.max - f.hp);
      if (heal > 0) {
        f.hp += heal;
        msg.textContent += ` It drains ${heal} HP from you.`;
      }
    }
    if (f.poison && p.hp > 0 && Math.random() < POISON_CHANCE) {
      poison = Math.max(1, poisonTurns() - enchSum('purity'));
      msg.textContent += ' You are poisoned!';
    }
    if (f.thief && !f.stolen && !perkN('purse') && p.hp > 0 && coins > 0 && Math.random() < THIEF_CHANCE) {
      f.stolen = Math.min(coins, roll(THIEF_STEAL[0], THIEF_STEAL[1]));
      f.fleeIn = THIEF_TURNS;
      coins -= f.stolen;
      msg.textContent += ` The ${f.name} snatches ${f.stolen} coins!`;
    }
    const thorns = enchSum('thorns');
    if (thorns && p.hp > 0 && f.hp > 0) {
      msg.textContent += ` Thorns cut the ${f.name} for ${Math.min(thorns, f.hp)}.`;
      damageFoe(f, thorns, false);
    }
    showGear();
  }
  if (f.crushEvery && (f.swings + 1) % f.crushEvery === 0 && p.hp > 0)
    msg.textContent += ` The ${f.name} winds up a huge swing...`;
  return checkDeath(f.name, `You were slain by the ${f.name}.`);
}

function foesAttack(mult = 1, blocking = false) {
  for (const f of foes.filter(f => f.hp > 0)) {
    const burning = f.burn > 0;
    if (burning) {
      f.burn--;
      msg.textContent += ` The ${f.name} burns for ${Math.min(f.burnDmg, f.hp)}.`;
      damageFoe(f, f.burnDmg, false);
      if (f.hp <= 0) continue;
    }
    if (f.regen) {
      if (f.noRegen) {
        f.noRegen = false;
      } else if (burning) {
        if (f.hp < f.max) msg.textContent += ` The flames stop the ${f.name} from regenerating.`;
      } else if (f.hp < f.max) {
        const heal = Math.min(f.regen, f.max - f.hp);
        f.hp += heal;
        msg.textContent += ` The ${f.name} regenerates ${heal} HP.`;
      }
    }
    if (f.fleeIn !== undefined) {
      if (f.fleeIn === 0) {
        f.hp = 0;
        f.fled = true;
        msg.textContent += ` The ${f.name} runs off with your ${f.stolen} coins!`;
        continue;
      }
      f.fleeIn--;
    }
    if (f.stunned) {
      f.stunned = false;
      msg.textContent += ` The ${f.name} is stunned and can't attack.`;
      continue;
    }
    if (!foeStrike(f, mult)) return;
    // a hit that lands on your raised shield may stun the attacker for its next turn
    if (blocking && f.landed && f.hp > 0 && Math.random() < stunChance()) {
      f.stunned = true;
      msg.textContent += ` The ${f.name} staggers off your shield, stunned!`;
    }
  }
  if (!tickPoison()) return;
  if (!foes.some(f => f.hp > 0)) endFight();
}

function killFoe(t) {
  const got = earn(roll(t.gold[0], t.gold[1]));
  const gained = Math.round(t.max / XP_DIVISOR);
  gainXp(gained);
  run.kills[t.name] = (run.kills[t.name] || 0) + 1;
  msg.textContent += ` ${t.name} defeated! +${got} coins, +${gained} XP.`;
  if (t.stolen) {
    coins += t.stolen;
    msg.textContent += ` You get your ${t.stolen} coins back.`;
  }
  if (t.split) {
    // foes is the encounter's group, so the halves stay if you flee and come back
    foes.push(...[0, 1].map(() => ({...LITTLE_SLIME, max: LITTLE_SLIME.hp, bonus: 0, def: 0, items: []})));
    msg.textContent += ` The ${t.name} splits in two!`;
  }
  showGear();
}

// everyone is dead or gone: loot if you killed anything, otherwise just walk on
function endFight() {
  const killedAny = foes.some(f => !f.fled);
  current.dead = true;
  const mend = Math.min(enchSum('mending'), p.max - p.hp);
  if (killedAny && mend > 0) {
    p.hp += mend;
    msg.textContent += ` Your gear mends ${mend} HP.`;
  }
  if (current.boss) {
    msg.textContent += ' The way to the exit is clear! ' + loot(2, 2);
  } else if (killedAny) {
    msg.textContent += ' ' + loot(Math.min(2, current.zone));
  } else {
    phase = 'explore';
  }
  foes = [];
  current = null;
}

// every source of damage to an enemy (your hits, burning, Thorns) goes through here, so
// Skeleton reassembly, kills, splits, loot and the boss's rage work the same for all of them
function damageFoe(t, amount, crit) {
  const dealt = Math.min(amount, t.hp);
  t.hp -= dealt;
  run.dealt += dealt;
  if (t.hp === 0 && t.reassemble && !t.rose && !crit && Math.random() < REASSEMBLE_CHANCE) {
    t.rose = true;
    t.hp = Math.round(t.max * REASSEMBLE_HP);
    msg.textContent += ` The ${t.name}'s bones rattle back together!`;
  } else if (t.hp === 0) {
    killFoe(t);
  } else if (t.boss && !t.raged && t.hp <= t.max / 2) {
    t.raged = true;
    msg.textContent += ` The ${t.name} roars in a rage!`;
  }
  return dealt;
}

// one of your swings at t; label goes in front of the log text; returns 'miss', 'hit' or 'crit'
function strike(t, heavy, label) {
  // Focus shrinks every miss chance (normal, Heavy and Bat evasion alike); Balanced shrinks Heavy's
  const base = (t.evasion ?? PLAYER_MISS) + (heavy ? HEAVY_MISS : 0);
  const missChance = base * missKeep() * (heavy ? 1 - enchSum('balanced') : 1);
  const result = swingResult(missChance, critChance());
  if (result === 'miss') {
    run.misses++;
    msg.textContent += label + (heavy ? `Your heavy swing misses the ${t.name}.` : `You swing at ${t.name} and miss.`);
    return result;
  }
  let dmg = Math.max(1, roll(8, 14) + power('weapon') + bonusDmg - t.def);
  if (heavy) dmg = Math.round(dmg * HEAVY_MULT);
  const finisher = perkN('executioner') && t.hp < t.max * EXEC_THRESHOLD;
  if (finisher) dmg = Math.round(dmg * (1 + execBonus()));
  const ambush = current && current.ambushReady;
  if (ambush) {
    current.ambushReady = false;
    current.ambushed = true;
    dmg = Math.round(dmg * (1 + ambushBonus()));
  }
  const giant = t.max >= GIANT_HP && enchSum('giantslayer') > 0;
  if (giant) dmg = Math.round(dmg * (1 + enchSum('giantslayer')));
  if (result === 'crit') { dmg *= PLAYER_CRIT_MULT; run.crits++; }
  run.biggest = Math.max(run.biggest, dmg);
  msg.textContent += label + (result === 'crit' ? 'CRITICAL HIT! ' : '') +
    (heavy ? `You smash ${t.name} for ${dmg}.` : `You hit ${t.name} for ${dmg}.`) +
    (ambush ? ' (Ambush)' : '') + (finisher ? ' (Executioner)' : '') + (giant ? ' (Giantslayer)' : '');
  if (result === 'crit' && t.regen && dmg < t.hp) {
    t.noRegen = true;
    msg.textContent += ` The ${t.name}'s wounds stop closing.`;
  }
  const dealt = damageFoe(t, dmg, result === 'crit');
  const burn = enchSum('flaming');
  if (burn && t.hp > 0) {
    if (!t.burn) msg.textContent += ` The ${t.name} catches fire!`;
    t.burn = BURN_TURNS;
    t.burnDmg = burn;
  }
  const leech = Math.min(Math.round(dealt * enchSum('vampiric')), p.max - p.hp);
  if (leech > 0) {
    p.hp += leech;
    msg.textContent += ` You drain ${leech} HP.`;
  }
  return result;
}

// kind: 'normal', 'heavy' or 'block'
function act(kind) {
  if (over || phase !== 'fight') return;
  if (kind === 'block') {
    msg.textContent = 'You raise your guard.';
    const front = foes.find(f => f.hp > 0);
    if (perkN('shieldbash') && front) {
      msg.textContent += ` You bash the ${front.name} for ${Math.min(bashDmg(), front.hp)}.`;
      damageFoe(front, bashDmg(), false);
    }
    if (foes.some(f => f.hp > 0)) foesAttack(blockMult(), true);
    else endFight();
    draw();
    return;
  }
  const heavy = kind === 'heavy';
  const exposed = heavy ? HEAVY_EXPOSED : 1;
  const t = foes.find(f => f.hp > 0);
  msg.textContent = '';
  const result = strike(t, heavy, '');
  // a Swift weapon may strike again (the same enemy, or the next one if the first fell)
  if (result !== 'miss' && Math.random() < enchSum('swift')) {
    const next = foes.find(f => f.hp > 0);
    if (next) strike(next, heavy, ' Swift strike! ');
  }
  if (result === 'miss' && t.riposte && !t.stunned && t.hp > 0) {
    msg.textContent += ` The ${t.name} ripostes!`;
    if (!foeStrike(t, exposed)) return;
  }
  if (foes.some(f => f.hp > 0)) {
    foesAttack(exposed);
  } else {
    endFight();
  }
  draw();
}
normalBtn.onclick = () => act('normal');
heavyBtn.onclick = () => act('heavy');
blockBtn.onclick = () => act('block');

potionBtn.onclick = () => {
  if (over || (phase !== 'explore' && phase !== 'fight')) return;
  if (!potions) { msg.textContent = 'No potions left.'; return; }
  if (p.hp === p.max && !poison) { msg.textContent = 'Already at full health.'; return; }
  potions--;
  run.potions++;
  const heal = Math.min(potionHeal(), p.max - p.hp);
  p.hp += heal;
  msg.textContent = `You drink a potion and heal ${heal}.`;
  if (poison) {
    poison = 0;
    msg.textContent += ' The poison is cured.';
  }
  if (phase === 'fight') foesAttack();
  showGear();
  draw();
};

shop.onclick = e => {
  const b = e.target.closest('button');
  if (!b || b.disabled) return;
  if (phase === 'enchanter') return enchanterClick(b);
  if (b.id === 'shopLeave') {
    shop.hidden = true;
    phase = 'explore';
    msg.textContent = '';
    return;
  }
  const it = shopStock[b.dataset.i];
  if (!canBuy(it)) return;
  coins -= it.price;
  if (it.type === 'potion') {
    potions++;
    shopPotionsLeft--;
    msg.textContent = 'Bought a health potion.';
  } else if (it.type === 'bag') {
    maxPotions = it.to;
    msg.textContent = `Bought the ${it.name}. You can now carry ${it.to} potions.`;
  } else if (it.type === 'satchel') {
    bagSlots++;
    msg.textContent = `Bought the ${it.name}. You can now carry ${bagSlots} scrolls.`;
  } else {
    worn[it.slot] = {name: it.name, power: it.power, tier: it.tier};
    refreshMax();
    msg.textContent = `Bought and equipped ${it.name}.`;
  }
  showGear();
  renderShop();
};

fightBtn.onclick = () => {
  choice.hidden = true;
  phase = 'fight';
  msg.textContent = 'Normal, Heavy or Block?';
  draw();
};

fleeBtn.onclick = () => {
  choice.hidden = true;
  if (Math.random() < FLEE_CHANCE + enchSum('fleetfoot')) {
    p.x = prev.x;
    p.y = prev.y;
    foes = [];
    current = null;
    phase = 'explore';
    msg.textContent = 'You slipped away!';
  } else {
    phase = 'fight';
    msg.textContent = 'Flee failed!';
    foesAttack();
    if (!over && phase === 'fight') msg.textContent += ' Normal, Heavy or Block?';
  }
  draw();
};

equipBtn.onclick = () => {
  const {slot, ...item} = pending;
  worn[slot] = item;
  refreshMax();
  msg.textContent = `Equipped ${itemName(item)}.`;
  closeLoot();
};

leaveBtn.onclick = () => {
  msg.textContent = `Left the ${itemName(pending)} behind.`;
  closeLoot();
};

c.addEventListener('pointerdown', e => {
  if (over || (phase !== 'explore' && phase !== 'fight')) return;
  if (phase === 'fight') return act('normal'); // tapping the map is a normal attack

  const r = c.getBoundingClientRect();
  const dx = e.clientX - r.left - c.width / 2;
  const dy = e.clientY - r.top - 176;
  let nx = p.x, ny = p.y;
  if (Math.abs(dx) > Math.abs(dy)) nx += Math.sign(dx);
  else ny += Math.sign(dy);
  if (!map[ny] || map[ny][nx] === '#') return;
  prev = {x: p.x, y: p.y};
  p.x = nx;
  p.y = ny;
  visited.add(`${nx},${ny}`);
  run.steps++;
  msg.textContent = '';
  if (!tickPoison()) return;

  const key = `${nx},${ny}`;
  const hit = enemies.find(e => e.x === nx && e.y === ny && !e.dead);
  const sh = shops[map[ny][nx]];
  if (hit) {
    if (!hit.group) hit.group = makeGroup(hit.zone);
    hit.seen = true;
    current = hit;
    foes = hit.group;
    foes.forEach(f => f.fresh = true); // a new fight: the Minotaur gets to charge again
    // Pathfinder: an enemy you spotted before walking into it can be ambushed (once)
    hit.ambushReady = !!(hit.spottedEarly && perkN('pathfinder') && !hit.ambushed);
    phase = 'choice';
    choice.hidden = false;
    const live = foes.filter(f => f.hp > 0);
    const bossFoe = live.find(f => f.boss);
    fleeBtn.disabled = !!bossFoe;
    msg.textContent = bossFoe
      ? `The ${bossFoe.name} blocks the exit! No running from this one.`
      : live.length > 1
        ? `Enemies appear: ${live.map(describe).join(', ')}!`
        : `A ${describe(live[0])} appears!`;
  } else if (sh && sh.enchanter) {
    ench = {};
    phase = 'enchanter';
    renderEnchanter();
    shop.hidden = false;
    msg.textContent = 'Enchanter: "Bring me your gear, and coins, and I will make it sing."';
  } else if (sh) {
    shopStock = makeStock(sh.tier);
    shopTitle = sh.title;
    phase = 'shop';
    renderShop();
    shop.hidden = false;
    msg.textContent = "Merchant: what'll it be?";
  } else if (map[ny][nx] === 'C' && !opened.has(key)) {
    msg.textContent = 'You open a chest! ' + openChest(key);
  } else if (map[ny][nx] === 'D') {
    loadFloor(floor + 1);
    msg.textContent = lastFloor()
      ? `You descend to floor ${floor + 1}. The air reeks of ogre...`
      : `You descend to floor ${floor + 1}.`;
  }
  if (map[ny][nx] === 'E') {
    msg.textContent = 'You step into daylight.';
    endRun(true);
  }
  draw();
});

draw();
showGear();
</script>
